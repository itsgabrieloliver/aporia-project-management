version = 1

[project]
name = "aporia"

[[frames]]
name = "default"
stack = "sveltekit"
port = 3000
replicas = 1

[[frames]]
name = "aporia-app-db"
kind = "database"
engine = "mongodb"
storage_gb = 10
inject_into = "default"
inject_as = "DATABASE_URL"

[[frames]]
name = "aporia-cache"
kind = "database"
engine = "redis"
storage_gb = 1
inject_into = "default"
inject_as = "REDIS_URL"
